name: camscannerall
description: "سكانر المستندات — مسح وتنظيم واستخراج نص، بالكامل على الجهاز."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure storage & crypto (PIN salt, automatic-backup key, backup file encryption)
  flutter_secure_storage: ^11.1.1
  encrypt: ^5.0.3
  crypto: ^3.0.5
  pointycastle: ^3.9.1

  # Camera & imaging
  image: ^4.3.0
  # Drives the native document scanner UI on each platform: Google ML Kit's
  # Document Scanner on Android, Apple VisionKit's document camera on iOS —
  # both give a real live automatic edge/corner detector.
  cunning_document_scanner: ^3.0.2

  # OCR
  google_mlkit_text_recognition: ^0.15.0

  # PDF (build, print, share — no password protection in this simplified scope)
  pdf: ^3.11.1
  printing: ^5.13.4

  # Lock screen
  local_auth: ^2.3.0

  # Local backup reminder notification
  flutter_local_notifications: ^18.0.1

  # Sharing
  share_plus: ^13.3.0

  # Explicit "save to gallery" export
  gal: ^2.3.3

  # File system & permissions
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_picker: ^12.3.0

  # Backup packaging, batch export
  archive: ^4.0.9

  # Design system typography (bundled offline, see lib/theme/app_theme.dart)
  google_fonts: ^6.2.1

  # Misc utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  provider: ^6.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Manrope (Latin) and Cairo (Arabic) — bundled as plain assets, not a
  # `fonts:` block, so google_fonts finds them in the asset manifest and
  # loads them offline instead of over the network.
  assets:
    - assets/fonts/Manrope-Regular.ttf
    - assets/fonts/Manrope-Medium.ttf
    - assets/fonts/Manrope-SemiBold.ttf
    - assets/fonts/Manrope-Bold.ttf
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Medium.ttf
    - assets/fonts/Cairo-SemiBold.ttf
    - assets/fonts/Cairo-Bold.ttf
